name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # chaves públicas do app (a segurança vem do RLS no Supabase)
      EXPO_PUBLIC_SUPABASE_URL: https://jlcisnsdbrynxozrfqey.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_-cL1n7qt__nXZjNU0gVkug_pkZpp8kK
      EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://diegoapexall.github.io/feito-app' }}
      EXPO_PUBLIC_CHECKOUT_PRO_URL: ${{ vars.CHECKOUT_PRO_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: |
          set -o pipefail
          npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tee -a build.log
          npx expo install --fix -- --legacy-peer-deps 2>&1 | tee -a build.log

      - name: Testes
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a build.log

      - name: Checagem de tipos (informativa)
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee -a build.log

      - name: Gerar projeto Android
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee -a build.log

      - name: Compilar APK
        run: |
          set -o pipefail
          cd android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a ../build.log

      - name: Publicar APK
        run: |
          VERSAO=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSAO}-build.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "Feito-${VERSAO}-build${{ github.run_number }}.apk"
          gh release create "$TAG" "Feito-${VERSAO}-build${{ github.run_number }}.apk" \
            --title "Feito! ${VERSAO} (build ${{ github.run_number }})" \
            --notes "APK para instalar no Android. Baixe o arquivo .apk abaixo pelo celular e toque nele para instalar (permita 'instalar apps desconhecidos'). Commit: ${{ github.sha }}" \
            --latest

      - name: Publicar log do erro
        if: failure()
        run: |
          TAG="log-erro-${{ github.run_number }}"
          { echo '```'; tail -c 100000 build.log | grep -v '^\s*$' | tail -n 400; echo '```'; } > notas.md
          gh release create "$TAG" --prerelease --title "Erro no build ${{ github.run_number }}" --notes-file notas.md --target "${{ github.sha }}" || true
